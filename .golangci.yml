# golangci-lint v2 config, run by `make lint` (part of `make check`). Install it with
# go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
# A best-effort call whose error has nothing to tell (a cleanup on a path that already failed) is
# written `_ = f()`, so the discard is visible; errcheck accepts that.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # Writes that cannot fail, or whose failure the caller cannot act on.
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        # A reply to the frontend: a failed write means the page went away.
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        # Win32 calls: the error is GetLastError's, read only where the caller checks the result.
        - (*syscall.LazyProc).Call
    staticcheck:
      checks:
        - all
        # The defaults' exclusions.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Errors start with the client file or protocol they name (Light.dbc, SOAP).
        - -ST1005
        # De Morgan rewrites that read worse than the original.
        - -QF1001
  exclusions:
    rules:
      # A deferred Close or cleanup has nothing useful to report.
      - linters: [errcheck]
        source: "^\\s*defer (.*\\.Close\\(\\)|os\\.Remove(All)?\\()"
      # Tests ignore errors from their setup and fuzz targets on purpose; a failure shows in the asserts.
      - linters: [errcheck]
        path: _test\.go

issues:
  # Report every issue: the defaults (50 per linter, 3 of the same text) hide the rest.
  max-issues-per-linter: 0
  max-same-issues: 0
