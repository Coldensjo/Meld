<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>terrain shader check</title>
	</head>
	<body>
		<pre id="out"></pre>
		<script type="module">
			// Renders a terrain through WebGL and reports shader compile errors. See tests/browser/README.md.
			import * as THREE from 'three'
			import { Terrain } from '/src/lib/terrain/Terrain.ts'
			const out = document.getElementById('out')
			const log = (m) => (out.textContent += m + '\n')
			const origErr = console.error
			console.error = (...a) => {
				log('CONSOLE_ERROR ' + a.map(String).join(' '))
				origErr(...a)
			}
			window.addEventListener('error', (e) => log('EXCEPTION ' + e.message))
			try {
				const canvas = document.createElement('canvas')
				canvas.width = 256
				canvas.height = 256
				document.body.appendChild(canvas)
				const renderer = new THREE.WebGLRenderer({ canvas, antialias: false })
				const scene = new THREE.Scene()
				const t = new Terrain(128)
				t.generate('hills', 3)
				t.setPalette(['#5d8a2f', '#3f6b25', '#7a5a3a', '#7d7a76', '#d2bb84', '#e8eef5', '#8b857c', '#a07a50'])
				t.autoPaint(0, true)
				scene.add(t.group)
				const cam = new THREE.PerspectiveCamera(60, 1, 1, 5000)
				cam.position.set(260, 160, 260)
				cam.lookAt(256, 0, 256)
				scene.add(new THREE.DirectionalLight(0xffffff, 1))
				if (new URLSearchParams(location.search).has('break')) {
					// Sensitivity check: a broken fragment shader must be reported.
					t.material.fragmentShader = t.material.fragmentShader.replace('void main() {', 'void main() { broken syntax ;')
					t.material.needsUpdate = true
				}
				t.update()
				renderer.render(scene, cam)
				const gl = renderer.getContext()
				const px = new Uint8Array(256 * 256 * 4)
				gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, px)
				let lit = 0
				for (let i = 0; i < px.length; i += 4) if (px[i] + px[i + 1] + px[i + 2] > 30) lit++
				log('LIT_PIXELS ' + lit + ' of ' + 256 * 256)
				log('GL_ERROR ' + gl.getError())
				log('PROGRAMS ' + renderer.info.programs.length)
				log('PALETTE_LAYERS ' + t.palette.texture.depth)
				log('DONE')
			} catch (e) {
				log('FAIL ' + (e && e.stack ? e.stack : e))
			}
		</script>
	</body>
</html>
