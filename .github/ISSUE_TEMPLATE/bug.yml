name: Bug report
description: Something in Meld does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short; a few lines per field is enough. The loop triages every issue and rewrites it
        in the backlog's wording (the issue loop's triage). An issue from anyone but the owner waits for
        the owner's approval before it is worked on.
  - type: input
    id: summary
    attributes:
      label: What is wrong, in one sentence
      description: This becomes the issue title.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, and what you expected
      description: What you did, what happened, what should have happened instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: "The tool or panel, and if you can, the label that holding F8 shows over it. Better still, Help > Copy Scene and paste the line here."
  - type: dropdown
    id: effect
    attributes:
      label: How much it hurts you
      options:
        - Blocks my work
        - Slows me down
        - Minor annoyance
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or log (optional)
