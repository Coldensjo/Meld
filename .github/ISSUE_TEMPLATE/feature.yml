name: Feature request
description: Something Meld should do or do differently
body:
  - type: markdown
    attributes:
      value: |
        Keep it short; a few lines per field is enough. The loop triages every issue and rewrites it
        in the backlog's wording (the issue loop's triage). An issue from anyone but the owner waits for
        the owner's approval before it is worked on.
  - type: input
    id: summary
    attributes:
      label: What should change, in one sentence
      description: This becomes the issue title.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What you are trying to do, and what is in the way
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The tool, panel or menu it belongs to.
  - type: dropdown
    id: effect
    attributes:
      label: How much it would help you
      options:
        - I cannot do my work without it
        - It would save me a lot of time
        - Nice to have
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Example, screenshot or a similar feature elsewhere (optional)
      description: A Noggit Red behaviour counts as an example.
