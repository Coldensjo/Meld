# Runs the checks and unit tests on Linux at every push and pull request, since the issue loop works
# on Windows only and nothing else checks that Meld still builds and tests on Linux (#414). None of it
# needs a WoW client: the client tests skip without WOW_DIR, and no Blizzard assets are used here.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      # The root package is Wails v3, whose Linux code is cgo: it vets, tests and lints on the gtk3 tag
      # (LINUX_TAGS in the Makefile), so it needs the GTK3 and WebKitGTK 4.1 headers (#863).
      - name: Install GTK and WebKitGTK 4.1
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal cmd *.go)
          if [ -n "$unformatted" ]; then echo "gofmt: unformatted files (run gofmt -w):"; echo "$unformatted"; exit 1; fi
      - name: Bindings, licence notices and Prettier
        run: make bindings-check notices-check format-check
      - run: go vet -tags gtk3 ./internal/... ./cmd/...
      - run: go test -short -tags gtk3 ./internal/... ./cmd/...
      - run: bun run test
        working-directory: frontend
      - name: ESLint (no explicit any, no unexplained as unknown as)
        run: bun run lint
        working-directory: frontend
      - run: bun run check
        working-directory: frontend
      # The root package embeds frontend/dist, so it is vetted, linted and tested after the build.
      - run: bun run build
        working-directory: frontend
      - run: go vet -tags gtk3 .
      - run: go test -short -tags gtk3 .
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --build-tags gtk3 ./internal/... ./cmd/... .

  # The desktop build with WebKitGTK 4.1, as `make build-linux` runs it. Allowed to fail while it is
  # new, so a red build does not hide the result of the checks above; drop continue-on-error once it
  # has been green for a while.
  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      # Wails v3 on its gtk3 tag (LINUX_TAGS in the Makefile): GTK3 and WebKitGTK 4.1. The build is a
      # plain go build, so it needs no Wails CLI (#854).
      - name: Install GTK and WebKitGTK 4.1
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: make build-linux
