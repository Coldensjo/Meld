# Builds the documentation site from docs/ with VitePress (docs/.vitepress/config.mts) and publishes
# it to GitHub Pages (https://coldensjo.github.io/Meld/) whenever the docs or the frontend's
# dependencies change on main.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the pages' "Last updated" comes from the git history
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run docs:build
        working-directory: frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
